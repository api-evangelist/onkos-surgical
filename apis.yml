name: Onkos Surgical
description: >-
  Onkos Surgical is a privately held surgical oncology company founded in 2015 and
  headquartered in Parsippany, New Jersey, focused on innovative solutions for
  musculoskeletal oncology and complex orthopaedic procedures. Built on a digital
  platform grounded in patient imaging analysis, personalized surgical planning and
  advanced 3D printing, Onkos develops limb salvage systems, My3D personalized
  solutions, uDesign on-demand personalized surgical plans, and antibacterial-coated
  implants for tumor and revision orthopaedic applications. The company received the
  first FDA De Novo approval of an antibacterial coating for tumor and revision
  orthopaedic implants. Onkos does not currently publish a public developer API,
  OpenAPI, SDKs, or developer portal; its public surfaces are the corporate website,
  a product Instructions-for-Use (IFU) documentation library, and a surgeon training
  portal.
